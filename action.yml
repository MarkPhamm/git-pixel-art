name: git-profile-lineage
description:
  Draw a GitHub account's activity as a living dbt lineage graph, a looping GIF
  plus a still PNG and SVG, for a profile README.
branding:
  icon: git-merge
  color: blue

inputs:
  login:
    description: Account whose lineage graph to draw.
    default: ${{ github.repository_owner }}
  output-dir:
    description:
      Folder, relative to the workspace, that receives lineage.gif, lineage.png,
      lineage.svg, and preview.html.
    default: lineage
  token:
    description:
      Token for reading the account's public data; the built-in token is enough.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Download the git-lineage release this Action belongs to
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        version=$(grep -m1 '^version' "$GITHUB_ACTION_PATH/Cargo.toml" | cut -d'"' -f2)
        repository=$(grep -m1 '^repository' "$GITHUB_ACTION_PATH/Cargo.toml" | cut -d'"' -f2)
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) target=x86_64-unknown-linux-musl ;;
          Linux-ARM64) target=aarch64-unknown-linux-musl ;;
          macOS-X64) target=x86_64-apple-darwin ;;
          macOS-ARM64) target=aarch64-apple-darwin ;;
          *)
            echo "git-lineage has no build for $RUNNER_OS $RUNNER_ARCH; use ubuntu-latest" >&2
            exit 1
            ;;
        esac
        archive="git-lineage-$version-$target.tar.gz"
        install_dir="$RUNNER_TEMP/git-lineage"
        mkdir -p "$install_dir"
        if ! gh release download "v$version" --repo "$repository" --dir "$install_dir" \
            --pattern "$archive" --pattern "$archive.sha256"; then
          echo "release v$version has no asset $archive; reference the Action at a release tag" >&2
          exit 1
        fi
        cd "$install_dir"
        if command -v sha256sum > /dev/null; then
          sha256sum -c "$archive.sha256"
        else
          shasum -a 256 -c "$archive.sha256"
        fi
        tar -xzf "$archive"
        echo "$install_dir/git-lineage-$version-$target" >> "$GITHUB_PATH"
    - name: Collect the account snapshot
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        LINEAGE_LOGIN: ${{ inputs.login }}
      run:
        git-lineage collect "$LINEAGE_LOGIN" --output
        "$RUNNER_TEMP/lineage-snapshot.json"
    - name: Render the lineage graph
      shell: bash
      env:
        LINEAGE_OUTPUT_DIR: ${{ inputs.output-dir }}
      run:
        git-lineage render "$RUNNER_TEMP/lineage-snapshot.json" --output-dir
        "$LINEAGE_OUTPUT_DIR"
