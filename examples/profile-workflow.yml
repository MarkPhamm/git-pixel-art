# Copy into your profile repository as .github/workflows/lineage.yml, then embed
# <img src="lineage/lineage.gif" width="768" alt="My data pipeline"> in its README.md.
name: Lineage

on:
  schedule:
    # Just after midnight UTC, so the graph shows the day that just ended.
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths: [.github/workflows/lineage.yml]

permissions:
  contents: write

concurrency: lineage

jobs:
  lineage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: MarkPhamm/git-pixel-art@v2
        with:
          output-dir: lineage
      - name: Commit the lineage graph if it changed
        shell: bash
        run: |
          git add lineage/lineage.gif
          if git diff --cached --quiet; then
            echo "The lineage graph is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "lineage: draw the day's pipeline"
          git push --quiet
